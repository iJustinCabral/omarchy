# Install separately as /etc/systemd/system/systemd-hibernate.service.d/omarchy-t2.conf.
# Preserve the vendor service's Requires/After=sleep.target and hibernate.target.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -B /var/lib/omarchy/t2-hibernate-product/runtime/packages/t2-suspend/hibernate/sleep_entry.py
TimeoutStartSec=infinity
