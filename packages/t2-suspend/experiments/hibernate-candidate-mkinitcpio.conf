source /etc/mkinitcpio.conf

for candidate_conf in /etc/mkinitcpio.conf.d/*.conf; do
  source "$candidate_conf"
done

candidate_hooks=()
for candidate_hook in "${HOOKS[@]}"; do
  if [[ $candidate_hook != "omarchy-t2-suspend" && $candidate_hook != "modconf" ]]; then
    candidate_hooks+=("$candidate_hook")
  fi
done
HOOKS=("${candidate_hooks[@]}")
unset candidate_conf candidate_hook candidate_hooks

# Load the complete candidate set from the private module root before switch_root.
# Wi-Fi precedes Bluetooth so the candidate preserves the installed probe order.
MODULES+=(brcmfmac brcmfmac-wcc brcmfmac-cyw brcmfmac-bca t2bce_dma t2bce_core t2bce_vhci t2bce_audio hci_bcm4377)

# The installed Bluetooth ordering file deliberately blacklists hci_bcm4377 so a
# userspace service can load it after Wi-Fi.  Initramfs startup uses modprobe -b,
# which would also suppress the explicit candidate module above.  Preserve every
# other host modprobe setting while omitting that host-only delayed-load policy.
candidate_bluetooth_blacklist=/etc/modprobe.d/t2-bluetooth-order.conf
for candidate_modprobe_conf in /etc/modprobe.d/*.conf /usr/lib/modprobe.d/*.conf; do
  if [[ -f $candidate_modprobe_conf && $candidate_modprobe_conf != $candidate_bluetooth_blacklist ]]; then
    FILES+=("$candidate_modprobe_conf")
  fi
done
unset candidate_bluetooth_blacklist candidate_modprobe_conf

# Apple board firmware is selected dynamically and is absent from MODULE_FIRMWARE.
for candidate_firmware in /usr/lib/firmware/brcm/brcmfmac4377b3-*; do
  [[ -f $candidate_firmware ]] && FILES+=("$candidate_firmware")
done
unset candidate_firmware
