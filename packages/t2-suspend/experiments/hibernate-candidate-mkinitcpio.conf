source /etc/mkinitcpio.conf

for candidate_conf in /etc/mkinitcpio.conf.d/*.conf; do
  source "$candidate_conf"
done

candidate_hooks=()
for candidate_hook in "${HOOKS[@]}"; do
  if [[ $candidate_hook != "omarchy-t2-suspend" ]]; then
    candidate_hooks+=("$candidate_hook")
  fi
done
HOOKS=("${candidate_hooks[@]}")
unset candidate_conf candidate_hook candidate_hooks

# A real-S4 resume kernel must not construct a second T2 firmware/DMA epoch
# before it restores the suspended image. Remove every candidate driver from
# the initramfs module tree. The candidate-only late hook carries exact module
# payloads through /run and loads them before root udev/modules-load on an
# ordinary boot where no hibernation image was restored.
candidate_modules=()
for candidate_module in "${MODULES[@]}"; do
  case $candidate_module in
    brcmfmac|brcmfmac[-_]bca|brcmfmac[-_]cyw|brcmfmac[-_]wcc|hci_bcm4377|t2bce_audio|t2bce_ave|t2bce_core|t2bce_dma|t2bce_vhci)
      ;;
    *)
      candidate_modules+=("$candidate_module")
      ;;
  esac
done
MODULES=("${candidate_modules[@]}")
HOOKS+=(omarchy-t2-candidate-modules)
unset candidate_module candidate_modules

# Apple board firmware is selected dynamically and is absent from MODULE_FIRMWARE.
for candidate_firmware in /usr/lib/firmware/brcm/brcmfmac4377b3-*; do
  [[ -f $candidate_firmware ]] && FILES+=("$candidate_firmware")
done
unset candidate_firmware
